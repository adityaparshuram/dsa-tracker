<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · DSA Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <div class="auth">
        <h1 id="head">Log in</h1>
        <label id="name-wrap" hidden>Name<input id="name" autocomplete="name"></label>
        <label>Email<input id="email" type="email" autocomplete="email"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>
        <p id="err" class="err" role="alert"></p>
        <button id="go" class="btn primary">Log in</button>
        <button id="switch" class="link">New here? Create an account</button>
    </div>
</main>
<script>
    const $ = s => document.querySelector(s);
    let register = false;
    async function post(path, body) {
        const r = await fetch('/api/auth/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.message || 'Something went wrong');
        return d;
    }
    function mode(reg) {
        register = reg;
        $('#head').textContent = reg ? 'Create account' : 'Log in';
        $('#go').textContent = reg ? 'Create account' : 'Log in';
        $('#name-wrap').hidden = !reg;
        $('#switch').textContent = reg ? 'Already have an account? Log in' : 'New here? Create an account';
        $('#err').textContent = '';
    }
    $('#switch').onclick = () => mode(!register);
    $('#go').onclick = async () => {
        const email = $('#email').value, password = $('#password').value;
        try {
            if (register) await post('register', { name: $('#name').value, email, password });
            await post('login', { email, password });
            location.href = 'index.html';
        } catch (e) { $('#err').textContent = e.message; }
    };
    document.addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
</script>
</body>
</html>
